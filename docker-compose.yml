version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - blog-network

  db:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'blog'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'admin'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'admin'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'admin1234'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    networks:
      - blog-network

networks:
  blog-network:
    name: blog-network